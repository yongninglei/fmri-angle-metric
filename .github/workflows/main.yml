name: CI

# Smoke check: install, every CLI answers --help. No tests exist yet.
# The Sphinx docs job was removed (maintainer, 2026-11-19).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Entry points
        run: |
          uv run angle-per-vertex --help > /dev/null
          uv run pca-response-profile --help > /dev/null
          uv run pca-cross-session --help > /dev/null
          uv run angle-cross-session --help > /dev/null
          uv run angle-roi-cross-session --help > /dev/null
