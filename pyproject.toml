[project]
name = "fmri-angle-metric"
version = "0.1.0"
description = "Per-vertex selectivity angle and PCA of fMRI PSC maps on the cortical surface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yongninglei", email = "yl4874@nyu.edu" }]
dependencies = [
    "nibabel>=5.3",
    "nilearn>=0.12",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.7",
    "typer>=0.12",
    "rich>=13.0",
    "matplotlib>=3.7",
]

[project.scripts]
angle-per-vertex    = "fmri_angle_metric.angle_per_vertex:app"
pca-response-profile = "fmri_angle_metric.pca_response_profile:app"
pca-cross-session   = "fmri_angle_metric.pca_cross_session:app"
angle-cross-session = "fmri_angle_metric.angle_cross_session:app"
angle-roi-cross-session = "fmri_angle_metric.angle_roi_cross_session:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmri_angle_metric"]

[tool.uv]
dev-dependencies = [
    "matplotlib>=3.7",
    "pytest>=8.0",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
